<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 535" role="img" aria-label="Time, observation age and latency">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7890ad"/></marker><style>text{font-family:system-ui,sans-serif;fill:#20394f}.title{font-size:25px;font-weight:750;fill:#16354f}.sub{font-size:15px;fill:#60758c}.head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#4e657d}.line{fill:none;stroke:#7890ad;stroke-width:2.5;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style></defs>
<rect width="1120" height="535" rx="20" fill="#f4f7fb"/>
<text x="30" y="42" class="title">VHERE | Time, observation age and latency</text>
<text x="30" y="73" class="sub">Definitions are shown schematically; lengths below are not measured stage durations.</text>
<rect x="30" y="125" width="220" height="110" rx="12" fill="#fff" stroke="#cfdaea"/>
<text x="46" y="155" class="head">Exposure</text>
<text x="46" y="182" class="body">Image observation time</text>
<rect x="310" y="125" width="220" height="110" rx="12" fill="#fff" stroke="#cfdaea"/>
<text x="326" y="155" class="head">Submission</text>
<text x="326" y="182" class="body">Client begins POST</text>
<rect x="590" y="125" width="220" height="110" rx="12" fill="#fff" stroke="#cfdaea"/>
<text x="606" y="155" class="head">Terminal poll</text>
<text x="606" y="182" class="body">Client receives terminal</text>
<text x="606" y="203" class="body">state</text>
<rect x="870" y="125" width="220" height="110" rx="12" fill="#fff" stroke="#cfdaea"/>
<text x="886" y="155" class="head">Display</text>
<text x="886" y="182" class="body">Current rendered time</text>
<path d="M250 180H301" class="line"/>
<path d="M530 180H581" class="line"/>
<path d="M810 180H861" class="line"/>
<rect x="310" y="285" width="500" height="95" rx="12" fill="#e6effb" stroke="#cfdaea"/>
<text x="326" y="315" class="head">Client terminal latency</text>
<text x="326" y="342" class="body">First terminal poll end minus client POST begin</text>
<rect x="30" y="410" width="500" height="90" rx="12" fill="#fff" stroke="#cfdaea"/>
<text x="46" y="440" class="head">Camera observation age</text>
<text x="46" y="467" class="body">Current display time minus original exposure time</text>
<rect x="570" y="410" width="520" height="90" rx="12" fill="#fff" stroke="#cfdaea"/>
<text x="586" y="440" class="head">Native processing and queue</text>
<text x="586" y="467" class="body">Separate server durations; not a network-only decomposition</text>
<text x="30" y="272" class="sub">Upload, admission, computation and polling occur between these boundaries.</text>
</svg>
